tags:
  - contacts
summary: Get all contacts
operationId: getAllContacts
description: Get list of user contacts with filtering, pagination and sorting
security:
  - bearerAuth: []

parameters:
  - in: query
    name: page
    schema:
      type: integer
      minimum: 1
    example: 1

  - in: query
    name: perPage
    schema:
      type: integer
      minimum: 1
      maximum: 100
    example: 10

  - in: query
    name: sortBy
    schema:
      type: string
    example: name

  - in: query
    name: sortOrder
    schema:
      type: string
      enum: [asc, desc]
    example: asc

  - in: query
    name: name
    schema:
      type: string
    example: John

responses:
  '200':
    description: Successfully retrieved contacts
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              required:
                - data
                - page
                - perPage
                - totalItems
                - totalPages
                - hasPreviousPage
                - hasNextPage
              properties:
                data:
                  type: array
                  items:
                    $ref: ../../components/schemas/contact.yaml
                page:
                  type: integer
                  example: 1
                perPage:
                  type: integer
                  example: 10
                totalItems:
                  type: integer
                  example: 35
                totalPages:
                  type: integer
                  example: 4
                hasPreviousPage:
                  type: boolean
                  example: false
                hasNextPage:
                  type: boolean
                  example: true

  '401':
    $ref: ../../components/responses/401.yaml

  '500':
    $ref: ../../components/responses/500.yaml
