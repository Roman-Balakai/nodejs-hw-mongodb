tags:
  - contacts
summary: Create a new contact
operationId: createContact
description: This endpoint allows you to create a new contact for the authenticated user. Supports file upload for contact photo.
security:
  - bearerAuth: []

requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            type: string
            description: Name of the contact
            example: John Doe
          phoneNumber:
            type: string
            description: Phone number of the contact
            example: +380501234567
          email:
            type: string
            format: email
            description: Email address of the contact
            example: john.doe@example.com
          contactType:
            type: string
            enum: [work, home, personal]
            description: Type of contact
            example: personal
          isFavourite:
            type: boolean
            description: Mark as favourite
            example: false
          photo:
            type: string
            format: binary
            description: Upload contact photo

responses:
  '201':
    description: Successfully created a contact
    content:
      application/json:
        schema:
          type: object
          required: [status, message, data]
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact!
            data:
              $ref: ../../components/schemas/contact.yaml

  '400':
    $ref: ../../components/responses/400.yaml
  '401':
    $ref: ../../components/responses/401.yaml
  '500':
    $ref: ../../components/responses/500.yaml
