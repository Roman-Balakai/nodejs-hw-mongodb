tags:
  - contacts
summary: Update an existing contact
operationId: updateContact
description: Update contact data by ID with optional photo upload
security:
  - bearerAuth: []

parameters:
  - name: id
    in: path
    required: true
    description: Contact ID
    schema:
      type: string
      example: 65fe02c6366cc98c0422ad06

requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            example: John Updated
          phoneNumber:
            type: string
            example: +380987654321
          contactType:
            type: string
            enum: [personal, business, other]
            example: business
          email:
            type: string
            format: email
            example: updated.email@example.com
          isFavourite:
            type: boolean
            example: true
          photo:
            type: string
            format: binary
            description: New contact photo

responses:
  '200':
    description: Successfully updated contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully updated contact!
            data:
              $ref: ../../../components/schemas/contact.yaml

  '400':
    $ref: ../../../components/responses/400.yaml
  '401':
    $ref: ../../../components/responses/401.yaml
  '404':
    $ref: ../../../components/responses/404.yaml
  '500':
    $ref: ../../../components/responses/500.yaml
