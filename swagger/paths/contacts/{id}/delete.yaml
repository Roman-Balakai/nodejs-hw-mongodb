tags:
  - contacts
summary: Delete contact by id
operationId: deleteContactById
description: Delete contact by id. Returns 204 No Content if deletion is successful.
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
    example: 67fe02c6366cc98c0422ad06
responses:
  '204':
    description: Successfully deleted contact
  '401':
    $ref: ../../../components/responses/401.yaml
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: Contact not found
  '500':
    $ref: ../../../components/responses/500.yaml
